name: Security Scan

on:
  push:
    paths:
      - ".github/workflows/security-scan.yaml"
      - "docker/**"
      - "docker-compose*.yaml"
      - "docker-compose*.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/security-scan.yaml"
      - "docker/**"
      - "docker-compose*.yaml"
      - "docker-compose*.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "pyproject.toml"
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip freeze | grep -v '^compliance @' > /tmp/compliance-requirements.txt

      - name: Run pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --requirement /tmp/compliance-requirements.txt --strict

  frontend-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run production npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run critical npm audit
        run: npm audit --audit-level=critical

      - name: Report full npm audit
        run: npm audit --audit-level=high || true

  trivy-filesystem:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-images:
    name: Trivy image scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: compliance-backend:scan
            dockerfile: docker/backend.Dockerfile
          - image: compliance-frontend:scan
            dockerfile: docker/frontend.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.image }}" .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ matrix.image }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
