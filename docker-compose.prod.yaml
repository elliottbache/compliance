x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    logging: *default-logging
    environment:
      PGDATA: /var/lib/compliance/postgres/data
    env_file:
      - /etc/compliance/.env
    volumes:
      - /var/lib/compliance/postgres:/var/lib/compliance/postgres/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    logging: *default-logging
    env_file:
      - /etc/compliance/.env
    environment:
      LOG_TO_FILE: "false"
    volumes:
      - /var/lib/compliance/attachments:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  clamav:
    image: clamav/clamav:stable
    logging: *default-logging
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    logging: *default-logging
    profiles:
      - local-ai
    volumes:
      - /var/lib/compliance/ollama:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    profiles:
      - local-ai
    env_file:
      - /etc/compliance/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${AI_MODEL}\""]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    logging: *default-logging
    env_file:
      - /etc/compliance/.env
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/lib/compliance/caddy/data:/data
      - /var/lib/compliance/caddy/config:/config
